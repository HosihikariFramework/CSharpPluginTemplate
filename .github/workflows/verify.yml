name: verify

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: 检查清单与入口
        run: |
          set -euo pipefail
          test -f hosihikari.json
          test ! -f manifest.json
          test -f main.cs
          test -f parts/helper.cs
          test -f MyCSharpPlugin.conf
          node -e "const m=JSON.parse(require('fs').readFileSync('hosihikari.json','utf8')); if(m.kind!=='plugin') throw new Error('kind'); if(m.apiVersion!==3) throw new Error('apiVersion'); if(m.loader!=='csharp') throw new Error('loader'); if(m.entry!=='main.cs') throw new Error('entry'); if(!m.dependencies?.some(d=>d.name==='hosihikari-csharp')) throw new Error('dependencies');"

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 契约按同名分支并列检出：模板验的是对当前契约的编译，不是已发布包（ADR-0059）。
      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Hosihikari.Plugin.Abstractions
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 用契约编译源码
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/compile-check"
          mkdir -p "$check"
          # 指令只在加载器与打包器里有意义；普通 csproj 里先去掉，再把 include 文件编进去。
          sed -E 's/^[[:space:]]*#:.*$//' main.cs > "$check/main.cs"
          cat > "$check/Check.csproj" <<XML
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="$check/main.cs" Link="main.cs" />
              <Compile Include="$GITHUB_WORKSPACE/parts/helper.cs" Link="parts/helper.cs" />
              <ProjectReference Include="$GITHUB_WORKSPACE/Hosihikari.Plugin.Abstractions/src/Hosihikari.Plugin.Abstractions.csproj" />
              <PackageReference Include="Microsoft.Extensions.Logging.Abstractions" Version="10.0.15" />
              <PackageReference Include="System.IO.Hashing" Version="10.0.15" />
            </ItemGroup>
          </Project>
          XML
          dotnet build "$check/Check.csproj" -c Release --nologo

  pack:
    runs-on: ubuntu-latest
    steps:
      - name: 模板
        uses: actions/checkout@v7
        with:
          path: template

      - name: 核心
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManager
          path: PluginManager
          # 跨仓并列检出必须钉同名分支（ADR-0059）；合并顺序固定为契约 → 核心 → 加载器。
          ref: ${{ github.head_ref || github.ref_name }}

      - name: 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Hosihikari.Plugin.Abstractions
          ref: ${{ github.head_ref || github.ref_name }}

      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/DotNetCorePlugins
          path: DotNetCorePlugins
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 打包
        run: bash template/pack.sh

      - name: 检查包
        run: |
          set -euo pipefail
          test -f template/dist/MyCSharpPlugin/main.cs
          test -f template/dist/MyCSharpPlugin/parts/helper.cs
          test -f template/dist/MyCSharpPlugin/System.IO.Hashing.dll
          test -f template/dist/MyCSharpPlugin/hosihikari.json
          test "$(node -p "require('./template/dist/MyCSharpPlugin/manifest.json').type")" = hosihikari
          test "$(node -p "require('./template/dist/MyCSharpPlugin/hosihikari.json').apiVersion")" = 3
